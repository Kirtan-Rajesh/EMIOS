<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMIOS - Enterprise Migration Intelligence Operating System</title>
  
  <!-- Fonts & Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" />
  
  <!-- Vis.js for stunning graph layout and physics simulation -->
  <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
  
  <!-- Tailwind for quick styling utility (used alongside MUI) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18, Babel, MUI, Recharts from UMD/CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Material UI UMD Bundle -->
  <script src="https://unpkg.com/@mui/material@5.14.20/umd/material-ui.production.min.js" crossorigin></script>
  
  <!-- Recharts CDN dependencies -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="index.css">

  <script>
    // Tailwind Config
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#00f2fe',
            brandSlate: '#121829',
            brandDark: '#0a0e1a',
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- React code with Babel compiler -->
  <script type="text/babel">
    const { 
      ThemeProvider, createTheme, CssBaseline, Box, Grid, Paper, AppBar, Toolbar, 
      Typography, Button, Tabs, Tab, CircularProgress, Divider, List, ListItem, 
      ListItemText, Card, CardContent, ButtonGroup, Chip, Alert, Dialog, DialogTitle,
      DialogContent, DialogActions, TextField, LinearProgress, Drawer, Fab
    } = MaterialUI;


    // Define Premium Light Theme
    const lightTheme = createTheme({
      palette: {
        mode: 'light',
        primary: {
          main: '#0284c7', // Sky blue
        },
        secondary: {
          main: '#4f46e5', // Indigo
        },
        background: {
          default: '#f8fafc',
          paper: 'rgba(255, 255, 255, 0.85)',
        },
        text: {
          primary: '#0f172a',
          secondary: '#475569',
        }
      },
      typography: {
        fontFamily: '"Outfit", "Roboto", "Helvetica", "Arial", sans-serif',
      }
    });

    function App() {
      // States
      const [activeTab, setActiveTab] = React.useState(0);
      const [nodes, setNodes] = React.useState([]);
      const [edges, setEdges] = React.useState([]);
      const [selectedNode, setSelectedNode] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [network, setNetwork] = React.useState(null);
      
      // Simulation States
      const [simulationTarget, setSimulationTarget] = React.useState(null);
      const [simulationResult, setSimulationResult] = React.useState(null);
      const [alreadyMigrated, setAlreadyMigrated] = React.useState([]);
      const [activeSimulationTab, setActiveSimulationTab] = React.useState(0);

      // Multi-Agent Planner States
      const [planResult, setPlanResult] = React.useState(null);
      const [planningLoading, setPlanningLoading] = React.useState(false);
      
      // Custom Upload Dialog State
      const [uploadDialogOpen, setUploadDialogOpen] = React.useState(false);
      const [nodesCSV, setNodesCSV] = React.useState('');
      const [edgesCSV, setEdgesCSV] = React.useState('');
      const [health, setHealth] = React.useState({ status: 'loading', database: 'checking' });
      const [uploadReport, setUploadReport] = React.useState(null);
      const [reportDialogOpen, setReportDialogOpen] = React.useState(false);

      // Copilot Chat & Observability States
      const [chatOpen, setChatOpen] = React.useState(false);
      const [chatMessages, setChatMessages] = React.useState([
        { role: 'assistant', content: 'Hello! I am your EMIOS Migration Copilot. Ask me anything about your Digital Twin topology, risk simulation results, or multi-agent wave recommendations.' }
      ]);
      const [chatInput, setChatInput] = React.useState('');
      const [chatLoading, setChatLoading] = React.useState(false);
      const [obsStatus, setObsStatus] = React.useState(null);

      // Fetch active graph, health, and observability on load
      React.useEffect(() => {
        loadGraph();
        checkHealth();
        fetchObservability();
      }, []);

      const fetchObservability = async () => {
        try {
          const res = await fetch('/api/observability/status');
          const data = await res.json();
          setObsStatus(data);
        } catch (e) {
          console.error("Observability fetch failed:", e);
        }
      };

      const handleSendChat = async () => {
        if (!chatInput.trim()) return;
        const newMsg = { role: 'user', content: chatInput };
        const updatedMsgs = [...chatMessages, newMsg];
        setChatMessages(updatedMsgs);
        setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: updatedMsgs })
          });
          const data = await res.json();
          setChatMessages([...updatedMsgs, { role: 'assistant', content: data.reply }]);
          fetchObservability();
        } catch (e) {
          setChatMessages([...updatedMsgs, { role: 'assistant', content: "Error calling Copilot: " + e.message }]);
        } finally {
          setChatLoading(false);
        }
      };

      const checkHealth = async () => {
        try {
          const res = await fetch('/api/health');
          const data = await res.json();
          setHealth(data);
        } catch (e) {
          setHealth({ status: 'degraded', database: 'offline' });
        }
      };


      const loadGraph = async () => {
        setLoading(true);
        try {
          const res = await fetch('/api/graph');
          const data = await res.json();
          setNodes(data.nodes || []);
          setEdges(data.edges || []);
          setSelectedNode(null);
          setSimulationResult(null);
          setSimulationTarget(null);
        } catch (error) {
          console.error("Error fetching graph data:", error);
        } finally {
          setLoading(false);
        }
      };

      const loadDemo = async () => {
        setLoading(true);
        try {
          const res = await fetch('/api/reset', { method: 'POST' });
          const data = await res.json();
          loadGraph();
        } catch (error) {
          console.error("Error loading demo:", error);
          setLoading(false);
        }
      };

      const handleDownloadTemplates = async () => {
        try {
          const res = await fetch('/api/templates/download');
          if (!res.ok) throw new Error("Templates endpoint returned error");
          const data = await res.json();
          
          // Nodes template file download
          const nodesBlob = new Blob([data.nodes], { type: 'text/csv' });
          const nodesUrl = window.URL.createObjectURL(nodesBlob);
          const a1 = document.createElement('a');
          a1.href = nodesUrl;
          a1.download = 'nodes_template.csv';
          a1.click();
          window.URL.revokeObjectURL(nodesUrl);

          // Edges template file download
          if (data.edges) {
            const edgesBlob = new Blob([data.edges], { type: 'text/csv' });
            const edgesUrl = window.URL.createObjectURL(edgesBlob);
            const a2 = document.createElement('a');
            a2.href = edgesUrl;
            a2.download = 'edges_template.csv';
            a2.click();
            window.URL.revokeObjectURL(edgesUrl);
          }
        } catch (error) {
          alert("Failed to download templates: " + error.message);
        }
      };

      const handleUploadCSV = async () => {
        if (!nodesCSV) return;
        setLoading(true);
        try {
          const formData = new FormData();
          
          // Detect if pasted data is JSON or CSV and name file extension accordingly
          const isJson = nodesCSV.trim().startsWith("[");
          const filename = isJson ? "metadata.json" : "metadata.csv";
          
          const nodesBlob = new Blob([nodesCSV], { type: isJson ? 'application/json' : 'text/csv' });
          formData.append('nodes_file', nodesBlob, filename);
          
          if (edgesCSV && !isJson) {
            const edgesBlob = new Blob([edgesCSV], { type: 'text/csv' });
            formData.append('edges_file', edgesBlob, 'dependencies.csv');
          }
          
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.message || "Invalid metadata file layout");
          }
          
          setUploadReport(data);
          setUploadDialogOpen(false);
          setReportDialogOpen(true);
        } catch (error) {
          alert("Ingestion Error: " + error.message);
        } finally {
          setLoading(false);
        }
      };


      const triggerSimulation = async (nodeId) => {
        setLoading(true);
        setSimulationTarget(nodeId);
        try {
          const res = await fetch('/api/simulate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              target_id: nodeId,
              already_migrated: alreadyMigrated
            })
          });
          const data = await res.json();
          setSimulationResult(data);
          // Switch to Simulation tab for details
          setActiveTab(1);
        } catch (error) {
          console.error("Simulation request failed:", error);
        } finally {
          setLoading(false);
        }
      };

      const triggerPlanning = async () => {
        setPlanningLoading(true);
        setPlanResult(null);
        try {
          const res = await fetch('/api/plan', { method: 'POST' });
          const data = await res.json();
          setPlanResult(data);
          // Switch to Planning tab
          setActiveTab(2);
        } catch (error) {
          console.error("Planning failed:", error);
        } finally {
          setPlanningLoading(false);
        }
      };

      // Vis.js Network rendering Logic
      React.useEffect(() => {
        const container = document.getElementById('network-graph');
        if (!container || nodes.length === 0) return;

        // Customise vis nodes based on active state / simulation results
        const visNodes = nodes.map(n => {
          let color = { background: '#1e293b', border: '#475569', highlight: { background: '#0f172a', border: '#00f2fe' } };
          let fontColor = '#f8fafc';
          let shadow = false;
          let label = `<b>${n.name}</b>\nComplexity: ${n.migration_complexity}\nImpact: $${n.revenue_impact.toLocaleString()}/mo`;
          
          // Apply colors depending on node properties
          if (simulationTarget === n.id) {
            color = { background: '#ef4444', border: '#f43f5e', highlight: { background: '#ef4444', border: '#ffffff' } };
            shadow = { enabled: true, color: '#f43f5e', size: 15 };
            label += `\n[MIGRATION SOURCE]`;
          } else {
            // Find if this node is modified in the simulation results
            const simNode = simulationResult?.impacted_services?.find(sn => sn.id === n.id);
            const riskProb = simNode ? simNode.failure_probability : n.failure_probability;
            
            if (riskProb > 0) {
              if (riskProb > 0.5) {
                // Critical disruption (Red)
                color = { background: '#ef4444', border: '#b91c1c', highlight: { background: '#dc2626', border: '#ef4444' } };
                shadow = { enabled: true, color: '#ef4444', size: 8 };
              } else {
                // Moderate disruption (Yellow)
                color = { background: '#eab308', border: '#a16207', highlight: { background: '#ca8a04', border: '#eab308' } };
                shadow = { enabled: true, color: '#eab308', size: 8 };
              }
              label += `\nRisk Prob: ${Math.round(riskProb * 100)}%`;
            } else {
              // Color based on type
              if (n.type === "Monolith") {
                color = { background: '#ca8a04', border: '#854d0e', highlight: { background: '#a16207', border: '#eab308' } };
              } else if (n.type === "Database") {
                color = { background: '#2563eb', border: '#1d4ed8', highlight: { background: '#1d4ed8', border: '#3b82f6' } };
              } else if (n.type === "Microservice") {
                color = { background: '#0d9488', border: '#0f766e', highlight: { background: '#0f766e', border: '#14b8a6' } };
              } else if (n.type === "Queue") {
                color = { background: '#7c3aed', border: '#6d28d9', highlight: { background: '#6d28d9', border: '#8b5cf6' } };
              }
            }
          }

          return {
            id: n.id,
            label: label,
            title: label.replace(/<[^>]*>/g, ''),
            color: color,
            shadow: shadow,
            shape: 'box',
            font: {
              color: fontColor,
              multi: 'html',
              size: 14,
              face: 'Outfit'
            },
            margin: 12,
            borderWidth: 2,
            shapeProperties: {
              borderRadius: 6
            }
          };
        });

        // Vis edges
        const visEdges = edges.map((e, idx) => {
          let edgeColor = e.is_discovered ? '#0d9488' : '#cbd5e1';
          let width = e.criticality === 'High' ? 3 : (e.criticality === 'Medium' ? 2 : 1);
          let styleDashed = e.is_discovered;
          let label = e.is_discovered ? 'discovered' : '';
          
          // Check if this connection matches a simulated cascading risk path
          let isCriticalPath = false;
          if (simulationResult?.critical_paths) {
            for (const path of simulationResult.critical_paths) {
              for (let i = 0; i < path.length - 1; i++) {
                if (path[i] === e.target && path[i+1] === e.source) {
                  isCriticalPath = true;
                  break;
                }
              }
            }
          }

          if (isCriticalPath) {
            edgeColor = '#ef4444';
            width = 4;
            styleDashed = true;
          }

          return {
            id: `edge-${idx}`,
            from: e.source,
            to: e.target,
            color: { color: edgeColor, highlight: '#00f2fe' },
            width: width,
            arrows: { to: { enabled: true, scaleFactor: 0.8 } },
            dashes: styleDashed,
            font: { size: 10, fill: '#ffffff', color: '#475569', face: 'Roboto' },
            label: label
          };
        });

        const graphData = { nodes: visNodes, edges: visEdges };
        const options = {
          physics: {
            stabilization: true,
            barnesHut: {
              gravitationalConstant: -2000,
              springLength: 150,
              springConstant: 0.04
            }
          },
          interaction: {
            hover: true,
            tooltipDelay: 200
          }
        };

        const activeNetwork = new vis.Network(container, graphData, options);
        
        // Save network instance
        setNetwork(activeNetwork);

        // Click interaction
        activeNetwork.on("click", (params) => {
          if (params.nodes.length > 0) {
            const clickedId = params.nodes[0];
            const foundNode = nodes.find(n => n.id === clickedId);
            setSelectedNode(foundNode || null);
          } else {
            setSelectedNode(null);
          }
        });

        return () => {
          activeNetwork.destroy();
        };

      }, [nodes, edges, simulationTarget, simulationResult]);

      // Handle custom files load dialog defaults
      const openUploadDialogWithDemoCSV = () => {
        setNodesCSV(
          "System ID,System Name,Category,Priority,Monthly Revenue ($),Complexity,Migration Cost ($),Migration Time (Days),Tech Stack,Annual Hosting Cost ($)\n" +
          "monolith,Legacy ERP & Catalog Monolith,Monolith,High,350000.0,High,500000.0,120,COBOL/Java 8,600000.0\n" +
          "user_service,Identity & User Access,Microservice,High,180000.0,Medium,35000.0,21,Go 1.20,40000.0\n" +
          "user_db,User Profiles Database,Database,High,200000.0,Medium,60000.0,30,PostgreSQL 14,80000.0\n" +
          "order_service,Order Processing Engine,Microservice,High,300000.0,Medium,45000.0,25,Go 1.20,55000.0\n" +
          "order_db,Orders Transaction Database,Database,High,300000.0,High,90000.0,45,PostgreSQL 14,120000.0\n" +
          "inventory_manager,Inventory Control Service,Microservice,High,150000.0,Medium,30000.0,18,Java 17 (Spring),50000.0\n" +
          "inventory_db,Warehouse Stock Oracle,Database,High,150000.0,High,120000.0,60,Oracle DB,180000.0"
        );
        setEdgesCSV(
          "From System,To System,Connection Type,Importance\n" +
          "monolith,user_service,Sync,High\n" +
          "user_service,user_db,DB,High\n" +
          "order_service,order_db,DB,High\n" +
          "order_service,user_service,Sync,High\n" +
          "order_service,inventory_manager,Sync,High\n" +
          "inventory_manager,inventory_db,DB,High\n" +
          "inventory_manager,order_service,Sync,High\n" +
          "monolith,inventory_db,DB,High"
        );
        setUploadDialogOpen(true);
      };

      return (
        <ThemeProvider theme={lightTheme}>
          <CssBaseline />
          
          {/* Main Container */}
          <Box className="flex flex-col min-h-screen relative">
            <div className="hero-glow"></div>
            
            {/* AppBar Top */}
            <AppBar position="static" className="glass-panel" sx={{ background: 'transparent', boxShadow: 'none' }}>
              <Toolbar className="flex justify-between items-center">
                <Box className="flex items-center gap-3">
                  <span className="material-icons text-sky-600 text-3xl">hub</span>
                  <Typography variant="h5" component="div" className="font-extrabold tracking-wider gradient-text">
                    EMIOS
                  </Typography>
                  <Typography variant="subtitle2" className="hidden md:inline-block text-slate-600 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                    Enterprise Migration Intelligence Operating System
                  </Typography>
                  {health.database === 'connected' && (
                    <Chip 
                      label="Neo4j Active" 
                      size="small" 
                      color="success" 
                      variant="outlined" 
                      className="text-[10px] font-bold h-5 border-emerald-500/20 text-emerald-600"
                    />
                  )}
                  {health.database === 'unconnected' && (
                    <Chip 
                      label="In-Memory Fallback" 
                      size="small" 
                      color="info" 
                      variant="outlined" 
                      className="text-[10px] font-bold h-5 border-sky-500/20 text-sky-600"
                    />
                  )}
                  {health.database === 'offline' && (
                    <Chip 
                      label="DB Offline" 
                      size="small" 
                      color="warning" 
                      variant="outlined" 
                      className="text-[10px] font-bold h-5 border-amber-500/20 text-amber-600"
                    />
                  )}
                </Box>
                
                <Box className="flex items-center gap-3">
                  <Button 
                    variant="outlined" 
                    color="secondary" 
                    startIcon={<span className="material-icons">cloud_upload</span>}
                    onClick={openUploadDialogWithDemoCSV}
                    size="small"
                  >
                    Upload CSV
                  </Button>
                  <Button 
                    variant="contained" 
                    color="primary"
                    startIcon={<span className="material-icons">refresh</span>}
                    onClick={loadDemo}
                    size="small"
                  >
                    Reset & Load Demo
                  </Button>
                </Box>
              </Toolbar>
            </AppBar>

            {/* Sub-nav Tabs */}
            <Box className="px-6 mt-4 flex items-center justify-between border-b border-slate-200">
              <Tabs 
                value={activeTab} 
                onChange={(e, v) => setActiveTab(v)}
                textColor="primary"
                indicatorColor="primary"
              >
                <Tab label="Digital Twin Graph" className="font-semibold" />
                <Tab label="What-If Simulation" className="font-semibold" disabled={!simulationResult} />
                <Tab label="Agentic Wave Planner" className="font-semibold" />
              </Tabs>
              
              {/* Agent Execution Trigger */}
              <Box className="pb-2">
                <Button
                  variant="outlined"
                  color="primary"
                  className="pulse-red"
                  disabled={planningLoading}
                  startIcon={planningLoading ? <CircularProgress size={16} /> : <span className="material-icons">psychology</span>}
                  onClick={triggerPlanning}
                >
                  {planningLoading ? "Negotiating Waves..." : "Run Multi-Agent Planner"}
                </Button>
              </Box>
            </Box>

            {/* Content Layout */}
            <Box className="flex-1 p-6">
              {loading && <LinearProgress color="primary" className="mb-4 rounded" />}

              {activeTab === 0 && (
                <Grid container spacing={4}>
                  {/* Left Column: Digital Twin Graph */}
                  <Grid item xs={12} lg={8}>
                    <Paper className="glass-panel p-4 flex flex-col gap-3">
                      <Box className="flex justify-between items-center">
                        <Box>
                          <Typography variant="h6" className="font-bold flex items-center gap-2 text-sky-600">
                            <span className="material-icons">settings_ethernet</span> Living Digital Twin
                          </Typography>
                          <Typography variant="caption" className="text-slate-600">
                            Graph represents services (nodes) and dependencies (edges). Solid lines are declared dependencies; dotted teal represent agent-discovered links.
                          </Typography>
                        </Box>
                        <Box className="flex gap-2">
                          <Chip label="Monolith" size="small" style={{ backgroundColor: '#ca8a04', color: '#000' }} />
                          <Chip label="Database" size="small" style={{ backgroundColor: '#2563eb' }} />
                          <Chip label="Microservice" size="small" style={{ backgroundColor: '#0d9488' }} />
                          <Chip label="Queue" size="small" style={{ backgroundColor: '#7c3aed' }} />
                        </Box>
                      </Box>

                      {/* Vis.js element */}
                      <div id="network-graph"></div>
                    </Paper>
                  </Grid>

                  {/* Right Column: Node Inspector & Controls */}
                  <Grid item xs={12} lg={4}>
                    <Grid container spacing={3}>
                      {/* Section 1: Instructions/Details */}
                      <Grid item xs={12}>
                        {selectedNode ? (
                          <Paper className="glass-panel p-5 flex flex-col gap-4">
                            <Box className="flex justify-between items-start">
                              <Box>
                                <Typography variant="h5" className="font-extrabold text-sky-600">
                                  {selectedNode.name}
                                </Typography>
                                <Chip label={selectedNode.type} size="small" className="mt-1" color="secondary" />
                              </Box>
                              <Chip 
                                label={selectedNode.status} 
                                size="small" 
                                color={selectedNode.status === 'Legacy' ? 'warning' : 'info'}
                              />
                            </Box>
                            
                            <Divider className="bg-white/10" />
                            
                            <Grid container spacing={2}>
                              <Grid item xs={6}>
                                <Typography variant="caption" className="text-slate-600 block">Revenue Impact</Typography>
                                <Typography variant="h6" className="font-bold text-slate-900">
                                  ${selectedNode.revenue_impact.toLocaleString()}/mo
                                </Typography>
                              </Grid>
                              <Grid item xs={6}>
                                <Typography variant="caption" className="text-slate-600 block">Business Value</Typography>
                                <Typography variant="h6" className="font-bold text-slate-900">
                                  {selectedNode.business_value}
                                </Typography>
                              </Grid>
                              <Grid item xs={6}>
                                <Typography variant="caption" className="text-slate-600 block">Migration Cost</Typography>
                                <Typography variant="h6" className="font-bold text-slate-900">
                                  ${selectedNode.base_cost.toLocaleString()}
                                </Typography>
                              </Grid>
                              <Grid item xs={6}>
                                <Typography variant="caption" className="text-slate-600 block">Complexity</Typography>
                                <Typography variant="h6" className="font-bold text-slate-900">
                                  {selectedNode.migration_complexity}
                                </Typography>
                              </Grid>
                              {selectedNode.runtime && selectedNode.runtime !== 'Unknown' && (
                                <Grid item xs={6}>
                                  <Typography variant="caption" className="text-slate-600 block">Runtime</Typography>
                                  <Typography variant="h6" className="font-bold text-teal-400 text-sm truncate">
                                    {selectedNode.runtime}
                                  </Typography>
                                </Grid>
                              )}
                              {selectedNode.annual_cost > 0 && (
                                <Grid item xs={6}>
                                  <Typography variant="caption" className="text-slate-600 block">Annual Hosting Cost</Typography>
                                  <Typography variant="h6" className="font-bold text-amber-500">
                                    ${selectedNode.annual_cost.toLocaleString()}/yr
                                  </Typography>
                                </Grid>
                              )}
                            </Grid>

                            <Divider className="bg-white/10" />

                            <Box className="flex flex-col gap-2 mt-2">
                              <Button 
                                variant="contained" 
                                color="error" 
                                startIcon={<span className="material-icons">play_circle</span>}
                                onClick={() => triggerSimulation(selectedNode.id)}

                  onClick={() => {
                    setReportDialogOpen(false);
                    loadGraph();
                  }} 
                  color="primary" 
                  variant="contained"
                >
                  Close & View Twin
                </Button>
              </DialogActions>
            </Dialog>
            {/* Floating Copilot FAB */}
            <Fab
              color="primary"
              variant="extended"
              onClick={() => setChatOpen(true)}
              className="fixed bottom-6 right-6 shadow-2xl z-50 bg-sky-600 hover:bg-sky-500 font-bold"
            >
              <span className="material-icons mr-2">psychology</span>
              Ask Migration Copilot
            </Fab>

            {/* Slide-out AI Copilot Chat Drawer */}
            <Drawer
              anchor="right"
              open={chatOpen}
              onClose={() => setChatOpen(false)}
              PaperProps={{ style: { width: '420px', backgroundColor: '#0f172a', color: '#f8fafc' } }}
            >
              <Box className="p-4 flex flex-col h-full">
                <Box className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <Box className="flex items-center gap-2">
                    <span className="material-icons text-sky-400">smart_toy</span>
                    <Typography variant="h6" className="font-bold text-sky-400">Migration Copilot</Typography>
                  </Box>
                  <Button onClick={() => setChatOpen(false)} color="inherit" size="small">
                    <span className="material-icons">close</span>
                  </Button>
                </Box>

                {/* Messages area */}
                <Box className="flex-1 overflow-y-auto my-4 flex flex-col gap-3 pr-1">
                  {chatMessages.map((msg, i) => (
                    <Box 
                      key={i} 
                      className={`p-3 rounded-lg max-w-[85%] text-xs font-mono leading-relaxed ${
                        msg.role === 'user' 
                          ? 'self-end bg-sky-600 text-white rounded-br-none' 
                          : 'self-start bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
                      }`}
                    >
                      <Typography variant="caption" className="font-bold block mb-1 opacity-70">
                        {msg.role === 'user' ? 'You' : 'Copilot AI'}
                      </Typography>
                      {msg.content}
                    </Box>
                  ))}
                  {chatLoading && (
                    <Box className="self-start p-3 bg-slate-800 border border-slate-700 rounded-lg text-xs text-sky-400 flex items-center gap-2">
                      <CircularProgress size={14} color="inherit" /> Thinking & inspecting Digital Twin...
                    </Box>
                  )}
                </Box>

                {/* Chat Input */}
                <Box className="flex gap-2 pt-2 border-t border-slate-800">
                  <TextField
                    fullWidth
                    size="small"
                    variant="outlined"
                    placeholder="Ask a question or debate migration trade-offs..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendChat()}
                    inputProps={{ style: { color: 'white', fontSize: '12px' } }}
                  />
                  <Button 
                    variant="contained" 
                    color="primary" 
                    disabled={chatLoading || !chatInput.trim()}
                    onClick={handleSendChat}
                  >
                    <span className="material-icons">send</span>
                  </Button>
                </Box>
              </Box>
            </Drawer>

            {/* Footer */}

            <Box className="py-4 text-center text-xs text-slate-600 border-t border-slate-200">
              EMIOS Enterprise Migration Intelligence System © 2026 - Modernizing Enterprise safely and profitably.
            </Box>
          </Box>
        </ThemeProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
